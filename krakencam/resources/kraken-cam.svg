<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Kraken CAM app icon: purple water droplet on a dark rounded square. -->
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f55f0"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#16181f"/>

  <!-- Water droplet: rounded teardrop, point up -->
  <path d="M32 11
           C 39 22, 47 30, 47 40
           a 15 15 0 1 1 -30 0
           C 17 30, 25 22, 32 11 Z"
        fill="url(#drop)"/>

  <!-- Specular highlight -->
  <path d="M26 38
           a 6.5 9 0 0 0 5 12"
        fill="none" stroke="#ecedf1" stroke-width="3"
        stroke-linecap="round" opacity="0.55"/>
</svg>
