name: Release

# Build the .deb and publish a GitHub release whenever a vX.Y.Z tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the .deb
        run: |
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh

      - name: Locate the artifact
        id: deb
        run: echo "path=$(ls packaging/dist/openkraken_*_amd64.deb | head -1)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenKraken ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.deb.outputs.path }}

  # Rebuild the APT index so `apt upgrade` sees this version. Called directly
  # rather than left to apt-repo.yml's `on: release` trigger: the release above
  # is published with ${{ github.token }}, and GitHub raises no
  # workflow-triggering events for GITHUB_TOKEN actions, so that trigger would
  # silently never fire for tag-driven releases (a lesson learned in Clippy —
  # four versions shipped there without the index being rebuilt).
  apt:
    needs: build-deb
    permissions:
      contents: write
    secrets: inherit          # apt-repo needs APT_GPG_PRIVATE_KEY to sign
    uses: ./.github/workflows/apt-repo.yml
